image: python:3.12-slim

definitions:
  steps:
    - step: &tests
        name: Tests
        script:
          # The slim image has no git, which the tests of the push actions need.
          - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
          - python -m unittest discover -t . -s tests -v

pipelines:
  default:
    - step: *tests
  pull-requests:
    '**':
      - step: *tests
